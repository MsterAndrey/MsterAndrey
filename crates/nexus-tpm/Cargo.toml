[package]
name = "nexus-tpm"
version = "0.1.0"
description = "NEXUS CUBE: claves de carpeta protegidas por el TPM 2.0 (Windows Platform Crypto Provider) y confirmación con Windows Hello. Prototipo, sin auditar."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nexus-envelope = { path = "../nexus-envelope" }
nexus-vault-local = { path = "../nexus-vault-local" }
zeroize = "1.8"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Security_Credentials_UI",
  "Foundation",
  "Win32_System_WinRT",
] }
windows-future = "=0.2.1"
