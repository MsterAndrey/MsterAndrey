[workspace]
resolver = "3"
members = ["crates/*"]
# La aplicación de escritorio sólo se compila en Windows (CI); tiene su propio workspace.
exclude = ["desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

# En código criptográfico, un desbordamiento aritmético debe detener la ejecución,
# no producir silenciosamente un valor incorrecto.
[profile.release]
overflow-checks = true
