# Integración continua: se ejecuta en cada push y pull request.
# Las acciones están fijadas por SHA de commit (cadena de suministro, ver docs/04 TM-09).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (nexus-envelope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy -p nexus-envelope --lib --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --locked
      - run: cargo test --locked --release

  web:
    name: Sitio web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build

  desktop-ui:
    name: Prototipo de escritorio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build

  windows-diagnostico:
    name: Diagnóstico TPM (Windows real)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test -p nexus-diagnostico --locked
      - run: cargo clippy -p nexus-tpm --all-targets --locked -- -D warnings
      - run: cargo test -p nexus-tpm --locked
      - run: cargo build -p nexus-diagnostico --release --locked
      # Ejecución real en la máquina virtual de GitHub (el veredicto depende de su hardware virtual).
      # El manifiesto debe pedir permisos de administrador al abrirse con doble clic.
      - run: if (-not (Select-String -Path .\target\release\nexus-diagnostico.exe -Pattern "requireAdministrator" -SimpleMatch -Quiet)) { Write-Error "falta el manifiesto UAC"; exit 1 }
      - run: .\target\release\nexus-diagnostico.exe --sin-abrir --salida informe-runner.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nexus-diagnostico-windows
          path: |
            target/release/nexus-diagnostico.exe
            informe-runner.json
            informe-runner.html
          retention-days: 30

  desktop-app:
    name: Aplicación de Windows (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: desktop
      # Compila la aplicación y genera el instalador NSIS (incluye el instalador de WebView2 si falta).
      - run: npx tauri build -- --locked
        working-directory: desktop
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nexus-cube-instalador-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
