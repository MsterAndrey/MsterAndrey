# Integración continua: se ejecuta en cada push y pull request.
# Las acciones están fijadas por SHA de commit (cadena de suministro, ver docs/04 TM-09).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (nexus-envelope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy -p nexus-envelope --lib --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --locked
      - run: cargo test --locked --release

  web:
    name: Sitio web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build

  windows-diagnostico:
    name: Diagnóstico TPM (Windows real)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test -p nexus-diagnostico --locked
      - run: cargo build -p nexus-diagnostico --release --locked
      # Ejecución real en la máquina virtual de GitHub (el veredicto depende de su hardware virtual).
      - run: .\target\release\nexus-diagnostico.exe --salida informe-runner.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: nexus-diagnostico-windows
          path: |
            target/release/nexus-diagnostico.exe
            informe-runner.json
          retention-days: 30
